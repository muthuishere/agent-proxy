patterns:

  - name: ANTHROPIC_API_KEY
    regex: 'sk-ant-api\d{2}-[A-Za-z0-9\-_]{20,}'
    type: apikey
    confidence: certain

  - name: OPENAI_API_KEY
    regex: 'sk-(proj-)?[A-Za-z0-9\-_]{20,}'
    type: apikey
    confidence: certain

  - name: AWS_ACCESS_KEY
    regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    type: apikey
    confidence: certain

  - name: AWS_ACCESS_KEY_ASSIGNMENT
    regex: '(?i)aws_access_key_id\s*[=:]\s*(?:\\?["''])?(?:AKIA|ASIA)[0-9A-Z]{16}(?:\\?["''])?'
    type: apikey
    confidence: certain

  - name: AWS_SECRET_KEY
    regex: '(?i)aws_secret_access_key\s*[=:]\s*(?:\\?["''])?[A-Za-z0-9/+=]{40}(?:\\?["''])?'
    type: apikey
    confidence: certain

  - name: AWS_SESSION_TOKEN
    regex: '(?i)aws_session_token\s*[=:]\s*(?:\\?["''])?[A-Za-z0-9/+=]{16,}(?:\\?["''])?'
    type: apikey
    confidence: certain

  - name: GOOGLE_API_KEY
    regex: 'AIza[0-9A-Za-z\-_]{35}'
    type: apikey
    confidence: certain

  - name: GITHUB_TOKEN
    regex: 'gh[ps]_[A-Za-z0-9]{36,}'
    type: apikey
    confidence: certain

  - name: GITLAB_TOKEN
    regex: 'glpat-[A-Za-z0-9\-_]{20}'
    type: apikey
    confidence: certain

  - name: HUGGINGFACE_TOKEN
    regex: 'hf_[A-Za-z0-9]{34,}'
    type: apikey
    confidence: certain

  - name: STRIPE_KEY
    regex: 'sk_live_[A-Za-z0-9]{24,}'
    type: apikey
    confidence: certain

  - name: SENDGRID_KEY
    regex: 'SG\.[A-Za-z0-9\-_]{22}\.[A-Za-z0-9\-_]{43}'
    type: apikey
    confidence: certain

  - name: JWT_TOKEN
    regex: 'eyJ[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+'
    type: jwt
    confidence: certain

  - name: PRIVATE_KEY_BLOCK
    regex: '(?s)-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----.*?-----END (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    type: cert
    confidence: certain

  - name: PRIVATE_KEY_HEADER
    regex: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    type: cert
    confidence: certain

  - name: GENERIC_CONNECTION_STRING
    regex: '(postgres|postgresql|mysql|mariadb|mongodb|redis|amqp|rabbitmq|kafka)://[^\s"''\\]{8,}'
    type: connstr
    confidence: certain

  - name: ENV_SECRET_ASSIGNMENT
    regex: '(?i)(password|passwd|secret|api_key|apikey|access_token|auth_token|private_key)\s*[=:]\s*[^\s"''\n]{6,}'
    type: password
    confidence: high

  - name: DOTENV_ASSIGNMENT
    regex: '^[A-Z_]{3,}_(KEY|SECRET|TOKEN|PASSWORD|PASS|PWD|CREDENTIAL)\s*=\s*.{6,}'
    type: password
    confidence: high
