# Secret-detection patterns for AgentProxy.
#
# Bulk-imported from gitleaks (https://github.com/gitleaks/gitleaks) -- MIT licensed.
# Last synced: 2026-05-11
# AgentProxy-specific assignment-style rules (those whose name ends in _ASSIGNMENT
# and JWT_TOKEN / GENERIC_CONNECTION_STRING) are local additions, not from gitleaks.
# Where AgentProxy and gitleaks both ship a rule for the same vendor
# (anthropic, openai, github, stripe, etc.), the AgentProxy version is kept
# because the existing test fixtures are tuned to it; the gitleaks rule id
# is listed in the alias map of the import tooling and skipped on re-sync.

patterns:

  - name: ANTHROPIC_API_KEY
    type: regex
    pattern: 'sk-ant-api\d{2}-[A-Za-z0-9\-_]{20,}'
    category: ai
    confidence: certain

  - name: OPENAI_API_KEY
    type: regex
    pattern: 'sk-(proj-)?[A-Za-z0-9\-_]{20,}'
    category: ai
    confidence: certain

  - name: GOOGLE_API_KEY
    type: regex
    pattern: 'AIza[0-9A-Za-z\-_]{35}'
    category: ai
    confidence: certain

  - name: HUGGINGFACE_TOKEN
    type: regex
    pattern: 'hf_[A-Za-z0-9]{34,}'
    category: ai
    confidence: certain

  - name: GITHUB_TOKEN
    type: regex
    pattern: '(?:gh[opsu]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{20,})'
    category: dev
    confidence: certain

  - name: GITLAB_TOKEN
    type: regex
    pattern: 'glpat-[A-Za-z0-9\-_]{20,}'
    category: dev
    confidence: certain

  - name: NPM_TOKEN
    type: regex
    pattern: 'npm_[A-Za-z0-9]{36,}'
    category: dev
    confidence: certain

  - name: STRIPE_SECRET_KEY
    type: regex
    pattern: 'sk_(?:live|test)_[A-Za-z0-9]{16,}'
    category: api
    confidence: certain

  - name: SENDGRID_KEY
    type: regex
    pattern: 'SG\.[A-Za-z0-9\-_]{22}\.[A-Za-z0-9\-_]{43}'
    category: api
    confidence: certain

  - name: SLACK_BOT_TOKEN
    type: regex
    pattern: 'xox[baprs]-[A-Za-z0-9-]{10,}'
    category: api
    confidence: high

  - name: SLACK_WEBHOOK
    type: regex
    pattern: 'https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
    category: api
    confidence: certain

  - name: AWS_ACCESS_KEY
    type: regex
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    category: cloud
    confidence: certain

  - name: AWS_ACCESS_KEY_ASSIGNMENT
    type: regex
    pattern: '(?i)aws_access_key_id\s*[=:]\s*(?:\\?["''])?(?:AKIA|ASIA)[0-9A-Z]{16}(?:\\?["''])?'
    category: cloud
    confidence: certain

  - name: AWS_SECRET_KEY
    type: regex
    pattern: '(?i)aws_secret_access_key\s*[=:]\s*(?:\\?["''])?[A-Za-z0-9/+=]{40}(?:\\?["''])?'
    category: cloud
    confidence: certain

  - name: AWS_SESSION_TOKEN
    type: regex
    pattern: '(?i)aws_session_token\s*[=:]\s*(?:\\?["''])?[A-Za-z0-9/+=]{16,}(?:\\?["''])?'
    category: cloud
    confidence: certain

  - name: CLOUDFLARE_TOKEN_ASSIGNMENT
    type: regex
    pattern: '(?i)(cloudflare(_api)?_token|cf_api_token)\s*[=:]\s*(?:\\?["''])?[A-Za-z0-9\-_]{20,}(?:\\?["''])?'
    category: cloud
    confidence: high

  - name: JWT_TOKEN
    type: regex
    pattern: 'eyJ[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+'
    category: auth
    confidence: certain

  - name: BEARER_TOKEN_ASSIGNMENT
    type: regex
    pattern: '(?i)\b(?:bearer|access_token|refresh_token|id_token|auth_token)\b\s*[=:]\s*(?:\\?["''])?[A-Za-z0-9\-_./+=]{12,}(?:\\?["''])?'
    category: auth
    confidence: high

  - name: GENERIC_CONNECTION_STRING
    type: regex
    pattern: '(?:postgres|postgresql|mysql|mariadb|mongodb(?:\+srv)?|redis|amqp|rabbitmq|kafka)://[^\s"''\\]{8,}'
    category: connstr
    confidence: certain

  - name: ENV_SECRET_ASSIGNMENT
    type: regex
    pattern: '(?i)(password|passwd|secret|api_key|apikey|access_token|auth_token|private_key|client_secret)\s*[=:]\s*(?:\\?"[^\\"\n]{6,}\\?"|[^\s"''\\]{6,})'
    category: env
    confidence: high

  - name: DOTENV_ASSIGNMENT
    type: regex
    pattern: '(?m)^[A-Z_]{3,}_(KEY|SECRET|TOKEN|PASSWORD|PASS|PWD|CREDENTIAL|PRIVATE_KEY)\s*=\s*[^\n\\]{6,}'
    category: env
    confidence: high

  - name: OPENSSH_PRIVATE_KEY
    type: contains_between
    block_start: '-----BEGIN OPENSSH PRIVATE KEY-----'
    block_end: '-----END OPENSSH PRIVATE KEY-----'
    category: key
    confidence: certain

  - name: RSA_PRIVATE_KEY
    type: contains_between
    block_start: '-----BEGIN RSA PRIVATE KEY-----'
    block_end: '-----END RSA PRIVATE KEY-----'
    category: key
    confidence: certain

  - name: EC_PRIVATE_KEY
    type: contains_between
    block_start: '-----BEGIN EC PRIVATE KEY-----'
    block_end: '-----END EC PRIVATE KEY-----'
    category: key
    confidence: certain

  - name: PKCS8_PRIVATE_KEY
    type: contains_between
    block_start: '-----BEGIN PRIVATE KEY-----'
    block_end: '-----END PRIVATE KEY-----'
    category: key
    confidence: certain

